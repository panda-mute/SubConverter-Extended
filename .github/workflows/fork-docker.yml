name: Build and Push Fork Docker Image

on:
  push:
    branches: [master, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    if: github.repository != 'Aethersailor/SubConverter-Extended'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Prepare image metadata
        id: image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
        shell: bash
        run: |
          set -euo pipefail
          : "${DOCKERHUB_USERNAME:?Configure the DOCKERHUB_USERNAME secret}"
          : "${DOCKERHUB_TOKEN:?Configure the DOCKERHUB_TOKEN secret}"
          image="${IMAGE_REPOSITORY:-${DOCKERHUB_USERNAME}/subconverter-extended}"
          if [[ ! "$image" =~ ^[a-z0-9][a-z0-9_-]*/[a-z0-9][a-z0-9._-]*$ ]]; then
            echo '::error::Docker Hub repository must have the form namespace/image in lowercase.'
            exit 1
          fi
          tag="${GITHUB_REF_NAME//\//-}"
          if [[ ! "$tag" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo '::error::The selected branch name cannot be used as a Docker tag.'
            exit 1
          fi
          {
            echo 'tags<<EOF'
            echo "${image}:${tag}"
            echo "${image}:sha-${GITHUB_SHA}"
            if [ "$GITHUB_REF" = refs/heads/master ]; then
              echo "${image}:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "VERSION=${tag}" >> "$GITHUB_ENV"
          echo "SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Activate pinned dependencies
        run: |
          python3 scripts/ci/dependency_snapshot.py check
          python3 scripts/ci/dependency_snapshot.py emit --github-env "$GITHUB_ENV"

      - name: Prepare Docker build arguments
        id: build_args
        env:
          THREADS: '4'
        run: |
          set -euo pipefail
          {
            echo 'args<<EOF'
            bash scripts/ci/docker-build-args.sh
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        env:
          BUILD_ARGS: ${{ steps.build_args.outputs.args }}
          IMAGE_TAGS: ${{ steps.image.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r arg; do
            [ -n "$arg" ] && args+=(--build-arg "$arg")
          done <<< "$BUILD_ARGS"
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(--tag "$tag")
          done <<< "$IMAGE_TAGS"
          docker buildx build \
            --file Dockerfile \
            --platform linux/amd64 \
            --push \
            "${args[@]}" \
            .
